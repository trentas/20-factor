# -----------------------------------------------------------------------------
# Exclude from Jekyll processing
# -----------------------------------------------------------------------------

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .claude/
  - node_modules/
  - "*.gemspec"
  - README.md
  - MAPPING.md
  - docs/
  - tests/
